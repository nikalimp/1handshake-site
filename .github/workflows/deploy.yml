# Сборка и выкладка сайта на хостинг по SSH (rsync) при каждом push в main.
# Секреты репозитория (Settings → Secrets and variables → Actions):
#   SSH_KEY  — приватный ключ деплоя (публичный — в ~/.ssh/authorized_keys на хостинге)
#   SSH_HOST — адрес сервера, SSH_USER — пользователь, SITE_DIR — папка сайта со слешем на конце
#   SITE_URL — адрес для проверки после выкладки (https://…)
#   SSH_KNOWN_HOSTS — необязательно: строка host-ключа сервера (ssh-keyscan с Mac); если задана, keyscan из Actions не нужен
# Переменная репозитория (Settings → Variables): NOINDEX=1, пока сайт на тестовом адресе — сборка закрыта от индексации.
#   На боевом домене переменную удалить: npm run check станет строгим (TODO, Метрика, реквизиты — ошибки).
# Перед первым запуском — pre-flight хостинга (гайд «Хостинги — что проверено»): порт 22 доступен из Actions?
# Хостинг без SSH из Actions — план Б из того же гайда (zip из out/ + файловый менеджер) или FTP-Deploy-Action.
name: Deploy

on:
  push:
    branches: [main]
    paths-ignore: ["specs/**", "*.md"]
  workflow_dispatch: {}

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NOINDEX: ${{ vars.NOINDEX }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # check = сборка + проверка TODO и geo-check: сайт с заглушками на хостинг не попадёт
      - run: npm run check
      # Какие страницы изменились с прошлой выкладки — для IndexNow (ключ: npm run indexnow:key)
      - run: node scripts/indexnow.mjs prepare

      - name: Заливка (rsync по SSH)
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SITE_DIR: ${{ secrets.SITE_DIR }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          [ -z "$SSH_KEY" ] && { echo "::error::Нет секрета SSH_KEY"; exit 1; }
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          # Ключ сервера: из секрета или keyscan с повторами. Ошибки не глушим — по ним видно, закрыт ли порт 22.
          if [ -n "$SSH_KNOWN_HOSTS" ]; then
            echo "$SSH_KNOWN_HOSTS" >> ~/.ssh/known_hosts
          else
            for i in 1 2 3; do ssh-keyscan -T 15 -H "$SSH_HOST" >> ~/.ssh/known_hosts && break; echo "keyscan: попытка $i не удалась"; sleep 5; done
          fi
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o ConnectTimeout=20 "$SSH_USER@$SSH_HOST" true \
            || { echo "::error::SSH до $SSH_HOST не работает из GitHub Actions (порт 22 закрыт для зарубежных IP или неверный ключ). План Б — гайд «Хостинги — что проверено»"; exit 1; }
          # Не трогаем .well-known (SSL), cgi-bin и служебные файлы панели.
          # Файлы, которые должны жить на сайте всегда (подтверждения Вебмастера, ключ IndexNow), — в public/.
          rsync -az --delete --stats --exclude '.well-known/' --exclude 'cgi-bin/' \
            -e "ssh -i ~/.ssh/deploy_key -o ConnectTimeout=20" out/ "$SSH_USER@$SSH_HOST:$SITE_DIR"

      - name: Сайт отвечает
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
        run: |
          [ -z "$SITE_URL" ] && exit 0
          code=$(curl -sk -o /dev/null -w "%{http_code}" --max-time 20 "$SITE_URL/" || true)
          echo "$SITE_URL: $code"
          [ "$code" = "200" ] || { echo "::error::Сайт ответил $code"; exit 1; }

      # Яндекс и Bing узнают о новых и изменённых страницах сразу, без ожидания обхода
      - name: IndexNow
        if: env.NOINDEX != '1'
        continue-on-error: true
        run: node scripts/indexnow.mjs submit
